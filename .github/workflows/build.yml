name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and Copy Debug Keystore
      run: |
        mkdir -p ~/.android
        mkdir -p ~/.config/.android
        keytool -genkeypair \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

    - name: Grant execute permission for gradlew
      working-directory: Beatles-3.1.1
      run: chmod +x gradlew
      
    # INI BAGIAN YANG DIUBAH: Pakai perintah Release dari README
    - name: Build with Gradle (Release)
      working-directory: Beatles-3.1.1
      run: ./gradlew assembleFossMobileUniversalRelease
      
    # PATH APK juga diubah karena hasil build-nya berupa Release
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Beatles-Release.apk
        path: Beatles-3.1.1/app/build/outputs/apk/fossMobileUniversal/release/*.apk
