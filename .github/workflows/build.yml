name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Membuat debug.keystore di lokasi default yang dicari Gradle (~/.android/)
    - name: Generate Debug Keystore in default location
      run: |
        mkdir -p ~/.android
        keytool -genkeypair \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Grant execute permission for gradlew
      working-directory: Beatles-3.1.1
      run: chmod +x gradlew
      
    - name: Build with Gradle
      working-directory: Beatles-3.1.1
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: Beatles-3.1.1/app/build/outputs/apk/debug/app-debug.apk
