name: Build Vortex Music APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. Ubah ke JDK 21 sesuai error terakhir
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 2. Buat Keystore di 2 lokasi (buat jaga-jaga)
    - name: Generate and Copy Debug Keystore
      run: |
        mkdir -p ~/.android
        mkdir -p ~/.config/.android
        keytool -genkeypair \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

    # 3. Kasih izin eksekusi
    - name: Grant execute permission for gradlew
      working-directory: Beatles-3.1.1
      run: chmod +x gradlew

    # 4. Build pakai perintah Release dari README
    - name: Build with Gradle (Release)
      working-directory: Beatles-3.1.1
      run: ./gradlew assembleFossMobileArm64Release

    # 5. Ganti nama file APK jadi VortexMusic-Release.apk
    - name: Rename APK
      run: |
        APK_FILE=$(ls Beatles-3.1.1/app/build/outputs/apk/fossMobileArm64/release/*.apk | head -n 1)
        mv "$APK_FILE" Beatles-3.1.1/app/build/outputs/apk/fossMobileArm64/release/VortexMusic-Release.apk

    # 6. Ambil APK-nya
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VortexMusic-Release.apk
        path: Beatles-3.1.1/app/build/outputs/apk/fossMobileArm64/release/VortexMusic-Release.apk
